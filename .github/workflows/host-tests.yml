name: Host Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-tests:
    name: Build and run host tests
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build gcc

      - name: Configure host tests
        run: cmake --preset host-tests

      - name: Build host tests
        run: cmake --build --preset host-tests --verbose

      - name: Run host tests
        run: ctest --preset host-tests
